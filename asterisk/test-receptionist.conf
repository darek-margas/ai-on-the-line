; Scripted test "receptionist" for phone-agent: dial 7999.
; Append to /etc/asterisk/extensions_custom.conf and run: fwconsole reload
; Needs custom/pa-test-1..6 sound files (any short recorded lines will do; the
; ones used in development were generated with Piper):
;   1 "Good afternoon, Riverside Motel, this is Sarah speaking."
;   2 "Sure, let me just check that for you. One moment."
;   3 "Yes, we have a family room that sleeps five, with a queen bed and three
;      singles. It is two hundred and ten dollars a night."
;   4 "Breakfast is not included, but there is a cafe next door. Would you like
;      me to book the room for you now?"
;   5 "No worries at all. Is there anything else I can help with?"
;   6 "Okay, thanks for calling. Bye now."
; After each line it waits for the agent to speak and then go quiet.

[from-internal-custom]
exten => 7999,1,Goto(phone-agent-test,s,1)

[phone-agent-test]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Set(LINE=1)
 same => n(next),Playback(custom/pa-test-${LINE})
 same => n,GotoIf($[${LINE} >= 6]?done)
 same => n,WaitForNoise(300,1,15)
 same => n,WaitForSilence(1500,1,25)
 same => n,Set(LINE=$[${LINE} + 1])
 same => n,Goto(next)
 same => n(done),Wait(2)
 same => n,Hangup()
