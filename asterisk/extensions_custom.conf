; Phone agent dialplan for FreePBX 17 (Asterisk 21/22).
; Paste into /etc/asterisk/extensions_custom.conf (or Admin > Config Edit), then: fwconsole reload
;
; The agent originates calls through ARI. When the far end answers, the call
; lands here: it is recorded and its audio is streamed to the agent container.
; AGENT_UUID and AGENT_SOCKET (host:port) are set by the agent on originate.
;
; The AudioSocket channel driver carries 16 kHz audio (c(slin16)), so G.722
; extensions get wideband speech; Asterisk converts down for 8 kHz trunks.
; Keep slin16 in step with AUDIO_RATE in the agent's .env. (The AudioSocket()
; dialplan app would also work, but only at 8 kHz: set AUDIO_RATE=8000 for it.)

[phone-agent]
exten => s,1,NoOp(Phone agent call ${AGENT_UUID})
 same => n,Set(CDR(userfield)=phone-agent:${AGENT_UUID})
 same => n,Set(AGENT_DEST=${CUT(CHANNEL,/,2)})
; Each side is also recorded on its own (-rx/-tx); agent-recording-finish (in this
; folder, installed in /usr/local/bin) levels them, mixes them again, and links the
; result into FreePBX call history (Reports > CDR), which looks for
; monitor/YYYY/MM/DD/<name> with the date as the 4th dash-separated part of <name>.
 same => n,Set(AGENT_RECDIR=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,Set(AGENT_RECNAME=agent-out-${FILTER(0-9A-Za-z,${CUT(AGENT_DEST,@,1)})}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${AGENT_UUID}.wav)
 same => n,Set(CDR(recordingfile)=${AGENT_RECNAME})
 same => n,MixMonitor(phone-agent/${AGENT_UUID}.wav,r(/var/spool/asterisk/monitor/phone-agent/${AGENT_UUID}-rx.wav)t(/var/spool/asterisk/monitor/phone-agent/${AGENT_UUID}-tx.wav),/usr/local/bin/agent-recording-finish ${AGENT_UUID} ${AGENT_RECDIR} ${AGENT_RECNAME})
 same => n,Dial(AudioSocket/${AGENT_SOCKET}/${AGENT_UUID}/c(slin16))
 same => n,Hangup()

; Incoming calls answered by the agent (profile "screener": takes messages, keeps
; cold callers talking). Needs these in /etc/asterisk/globals_custom.conf:
;   PHONE_AGENT_URL=http://<docker-host>:8090
;   PHONE_AGENT_SOCKET=<docker-host>:9092
;   PHONE_AGENT_TOKEN=<API_TOKEN from the agent's .env>
;   PHONE_AGENT_MOBILE=<your mobile without the leading 0, as in the SIP Diversion header>
;   PHONE_AGENT_CONTACT_GROUPS=<Contact Manager group ids, joined by _, e.g. 3_2>
;   PHONE_AGENT_CONTACTS_TOGGLE=<optional Call Flow Control index for forwarded contacts, e.g. 1>
; Test extension (add under [from-internal-custom]):
;   exten => 7990,1,Goto(phone-agent-inbound,s,1)
; An inbound route can use the same context as a custom destination.
; The call is registered with the agent first (who is calling, forwarded from where,
; which profile); if the agent refuses or is down, the caller hears a short message.
[phone-agent-inbound]
exten => s,1,Set(AGENT_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,Set(AGENT_PROFILE=${IF($["${AGENT_PROFILE}" = ""]?screener:${AGENT_PROFILE})})
 same => n,Set(AGENT_DIVERTED=)
 same => n,ExecIf($["${CHANNEL(channeltype)}" = "PJSIP"]?Set(AGENT_DIVERTED=${PJSIP_HEADER(read,Diversion)}))
 same => n,Set(CURLOPT(httpheader)=Authorization: Bearer ${PHONE_AGENT_TOKEN})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=10)
 same => n,Set(AGENT_REPLY=${CURL(${PHONE_AGENT_URL}/inbound,uuid=${AGENT_UUID}&profile=${AGENT_PROFILE}&caller=${URIENCODE(${CALLERID(num)})}&diverted=${URIENCODE(${AGENT_DIVERTED})})})
 same => n,GotoIf($["${AGENT_REPLY}" != "ok"]?unavailable)
 same => n,Set(CDR(userfield)=phone-agent-in:${AGENT_UUID})
; Each side is also recorded on its own (-rx/-tx); agent-recording-finish (in this
; folder, installed in /usr/local/bin) levels them, mixes them again, and links the
; result into FreePBX call history (Reports > CDR), which looks for
; monitor/YYYY/MM/DD/<name> with the date as the 4th dash-separated part of <name>.
 same => n,Set(AGENT_RECDIR=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,Set(AGENT_RECNAME=agent-in-${FILTER(0-9A-Za-z,${CALLERID(num)})}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${AGENT_UUID}.wav)
 same => n,Set(CDR(recordingfile)=${AGENT_RECNAME})
 same => n,MixMonitor(phone-agent/${AGENT_UUID}.wav,r(/var/spool/asterisk/monitor/phone-agent/${AGENT_UUID}-rx.wav)t(/var/spool/asterisk/monitor/phone-agent/${AGENT_UUID}-tx.wav),/usr/local/bin/agent-recording-finish ${AGENT_UUID} ${AGENT_RECDIR} ${AGENT_RECNAME})
 same => n,Dial(AudioSocket/${PHONE_AGENT_SOCKET}/${AGENT_UUID}/c(slin16))
 same => n,Hangup()
 same => n(unavailable),NoOp(Phone agent did not take the call: ${AGENT_REPLY})
 same => n,GotoIf($["${AGENT_FALLBACK}" != ""]?${AGENT_FALLBACK})
 same => n,Answer()
 same => n,Playback(im-sorry&cannot-complete-temp-error)
 same => n,Hangup()

; Inbound route for the home number (FreePBX: a Custom Destination with target
; phone-agent-route,s,1, chosen as the inbound route's destination). The caller is
; looked up in Contact Manager (groups in PHONE_AGENT_CONTACT_GROUPS, ids joined by
; "_"), live, so edits there count at once; a match also becomes the caller name.
; Calls forwarded from the owner's mobile (its number is in the SIP Diversion header)
; from anyone who isn't a contact go to purgatory (the screener). Forwarded contacts
; go through Call Flow Control toggle PHONE_AGENT_CONTACTS_TOGGLE if set (normal:
; usual rules; override: purgatory too). Direct calls from a mobile listed in
; [phone-agent-menus] go to that mobile's menu. Everything else follows the usual rules:
; change timeconditions,1,1 to whatever the route did before.
[phone-agent-route]
exten => s,1,Set(AGENT_DIVERTED_BY=${PJSIP_HEADER(read,Diversion)})
 same => n,Set(CMCID=)
 same => n,ExecIf($["${PHONE_AGENT_CONTACT_GROUPS}" != ""]?AGI(contactmanager.agi,${CALLERID(num)},${PHONE_AGENT_CONTACT_GROUPS},1))
 same => n,Set(AGENT_CONTACT=${IF($[${LEN(${CMCID})} > 0 & ${REGEX("^Unknown$" ${CMCID})} = 0]?1:0)})
 same => n,ExecIf(${AGENT_CONTACT}?Set(CALLERID(name)=${CMCID}))
 same => n,GotoIf($["${PHONE_AGENT_MOBILE}" != "" & ${REGEX("${PHONE_AGENT_MOBILE}" ${AGENT_DIVERTED_BY})}]?forwarded)
 same => n,Set(AGENT_CALLER=${CALLERID(num):-9})
 same => n,GotoIf($[${LEN(${AGENT_CALLER})} = 9 & ${DIALPLAN_EXISTS(phone-agent-menus,${AGENT_CALLER},1)}]?phone-agent-menus,${AGENT_CALLER},1)
 same => n,Goto(timeconditions,1,1)
 same => n(forwarded),GotoIf(${AGENT_CONTACT}?contact)
 same => n,NoOp(Forwarded from the mobile, not a contact: purgatory)
 same => n,Goto(phone-agent-screen,s,1)
 same => n(contact),NoOp(Forwarded call from a contact: ${CMCID})
 same => n,GotoIf($["${PHONE_AGENT_CONTACTS_TOGGLE}" != ""]?app-daynight,${PHONE_AGENT_CONTACTS_TOGGLE},1)
 same => n,Goto(timeconditions,1,1)

; Direct calls (not forwarded) from these mobiles, keyed by the caller ID's last 9
; digits, go to their own menu instead of the usual rules, e.g. an IVR that lets
; you dial an extension.
[phone-agent-menus]
exten => 4XXXXXXXX,1,Goto(ivr-1,s,1)
exten => 4YYYYYYYY,1,Goto(ivr-2,s,1)

; "Purgatory": the phone agent's screener, or 101's voicemail if the agent can't take
; the call. FreePBX Custom Destination target phone-agent-screen,s,1.
[phone-agent-screen]
exten => s,1,Set(AGENT_FALLBACK=ext-local,vmu101,1)
 same => n,Goto(phone-agent-inbound,s,1)

; Optional: day calls ring the desk phone first, then the agent instead of
; voicemail, so someone returning a call the agent made reaches something that can
; talk to them. Contacts (AGENT_CONTACT, set in [phone-agent-route]) still get
; voicemail. FreePBX: a Custom Destination with target phone-agent-ring-first,s,1,
; used as the time condition's daytime destination. Change 101 to your extension.
[phone-agent-ring-first]
exten => s,1,Dial(PJSIP/101,25)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${AGENT_CONTACT}" = "1"]?ext-local,vmu101,1)
 same => n,Goto(phone-agent-screen,s,1)
 same => n(done),Hangup()
